<!DOCTYPE html>
<html>
<head>

    <title>Add Customer - ADN</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back {
            margin-left: 15px;
            text-decoration: none;
            color: #6b7280;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Add Customer</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Customer Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter customer name"
                required
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email"
            >

            <label>Address</label>
            <textarea
                name="address"
                placeholder="Enter address"
            ></textarea>

            <div class="buttons">

                <button type="submit">
                    Save Customer
                </button>

                <a
                    href="{% url 'customers' %}"
                    class="back">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
